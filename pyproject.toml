description = "GridGaussians: Training large 3D Gaussian splatting models with grid-based training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.6",
    "lpips>=0.1.4",
    "matplotlib>=3.10.8",
    "numpy<2",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.2",
    "plyfile>=1.1.3",
    "pybind11>=3.0.4",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchvision>=0.15.0",
    "viser>=1.0.26",
]
