[project]
name = "grid-gaussians"
version = "0.1.0"
description = "GridGaussians: Training large 3D Gaussian splatting models with grid-based training"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
    "jupyterlab>=4.0",
    "lpips>=0.1.4",
    "matplotlib>=3.7",
    "numpy<2",
    "opencv-python",
    "pandas>=2.0,<3.0",
    "plyfile>=1.0",
    "psutil>=5.9",
    "pynvml>=11.0",
    "pybind11>=2.10",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "setuptools>=70.0",
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "torchvision==0.18.1",
    "viser>=0.1",
]

[tool.uv]
# Build submodules without isolation so torch is available during build
no-build-isolation = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
