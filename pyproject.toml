[project]
name = "abcd-gaussians"
version = "0.1.0"
description = "Alpha-Composited Block Coordinate Descent for out-of-core 3DGS"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "lpips>=0.1.4",
    "matplotlib>=3.7",
    "numpy<2",
    "nvidia-ml-py>=12.0",
    "opencv-python",
    "pandas>=2.0,<3.0",
    "pillow>=10.0",
    "plyfile>=1.0",
    "psutil>=5.9",
    "setuptools>=70.0",
    "torch==2.3.1",
    "torchvision==0.18.1",
    "tqdm>=4.66",
    "tyro>=1.0.13",
]

[project.optional-dependencies]
viewer = ["viser>=0.1"]

[project.scripts]
abcd-train = "abcd.train:main"
abcd-evaluate = "abcd.evaluate:main"
abcd-reproduce = "abcd.reproduce:main"
abcd-summarize = "abcd.summarize:main"
abcd-plot = "abcd.plot:main"
abcd-memory = "abcd.memory:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["abcd*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.uv]
# Build submodules without isolation so torch is available during build
no-build-isolation = true

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gpu: requires a CUDA-capable GPU and the CUDA rasterizer",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = [
    "src/abcd/train.py",
    "src/abcd/evaluate.py",
    "src/abcd/reproduce.py",
    "src/abcd/summarize.py",
    "src/abcd/plot.py",
    "src/abcd/memory.py",
    "src/abcd/io/split.py",
    "src/abcd/trainers/basic/state.py",
    "src/abcd/trainers/grid/storage.py",
    "scripts",
]
typeCheckingMode = "basic"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
